<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anokos Docs</title>
<meta name="description" content="How the Anokos kernel and operating system work: boot, memory, tasks, interrupts, file systems, the compiler and the ARM64 port.">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="../assets/favicon-64.png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000;
    --surface: #0b0b0d;
    --surface2: #131316;
    --border: #232327;
    --text: #f4f4f4;
    --muted: #a3a3ab;
    --faint: #6a6a72;
    --mark: #3a3a10;
    --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
    --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --header: 60px;
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: calc(var(--header) + 16px); }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans);
    font-size: 16px; line-height: 1.65; -webkit-font-smoothing: antialiased; }
  a { color: var(--text); text-underline-offset: 3px; }
  code, pre, kbd { font-family: var(--mono); }

  header { position: sticky; top: 0; z-index: 20; background: rgba(0, 0, 0, 0.85);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); }
  nav.top { display: flex; align-items: center; gap: 20px; height: var(--header); padding: 0 24px; }
  .logo { font-family: var(--mono); font-weight: 600; font-size: 18px; text-decoration: none;
    display: inline-flex; align-items: center; gap: 10px; white-space: nowrap; }
  .logo img { width: 30px; height: 30px; }
  .logo small { font-weight: 400; color: var(--muted); font-size: 15px; }
  .navlinks { display: flex; gap: 22px; margin-left: auto; font-size: 14.5px; }
  .navlinks a { color: var(--muted); text-decoration: none; }
  .navlinks a:hover, .navlinks a.on { color: var(--text); }
  .menu-btn { display: none; margin-left: auto; background: none; border: 1px solid var(--border); color: var(--text);
    font: 500 14px var(--sans); padding: 6px 12px; border-radius: 8px; cursor: pointer; }

  .layout { display: grid; grid-template-columns: 268px minmax(0, 1fr) 220px; max-width: 1440px; margin: 0 auto; }
  aside.side { position: sticky; top: var(--header); height: calc(100vh - var(--header)); overflow-y: auto;
    border-right: 1px solid var(--border); padding: 20px 16px 40px; }
  .search { position: relative; margin-bottom: 18px; }
  .search input { width: 100%; background: var(--surface); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 9px 12px 9px 34px; font: 14.5px var(--sans); outline: none; }
  .search input:focus { border-color: #55555c; }
  .search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--faint); }
  .search kbd { position: absolute; right: 9px; top: 50%; transform: translateY(-50%); font-size: 11px; color: var(--faint);
    border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; }
  .group { margin: 0 0 18px; }
  .group h4 { font-family: var(--mono); font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--faint); margin: 0 0 6px 8px; }
  .group a { display: block; padding: 5px 8px; border-radius: 6px; color: var(--muted); text-decoration: none; font-size: 14.5px; line-height: 1.4; }
  .group a:hover { color: var(--text); background: var(--surface); }
  .group a.on { color: var(--text); background: var(--surface2); font-weight: 500; }

  main { min-width: 0; padding: 36px 48px 80px; }
  article { max-width: 780px; }
  .crumbs { font-family: var(--mono); font-size: 12.5px; color: var(--faint); margin-bottom: 8px; letter-spacing: 0.03em; }
  article h1 { font-family: var(--mono); font-weight: 600; font-size: clamp(28px, 4vw, 38px); line-height: 1.15; margin: 0 0 18px; letter-spacing: -0.01em; }
  article h2 { font-family: var(--mono); font-weight: 600; font-size: 23px; margin: 44px 0 12px; padding-top: 22px; border-top: 1px solid var(--border); }
  article h3 { font-size: 18px; font-weight: 600; margin: 30px 0 8px; }
  article h4 { font-size: 16px; font-weight: 600; margin: 24px 0 6px; color: var(--muted); }
  article h2 a.anchor, article h3 a.anchor { color: var(--faint); text-decoration: none; margin-left: 8px; opacity: 0; font-weight: 400; }
  article h2:hover a.anchor, article h3:hover a.anchor { opacity: 1; }
  article p { margin: 0 0 16px; }
  article > p:first-of-type { font-size: 17.5px; color: #d6d6dc; }
  article ul, article ol { margin: 0 0 16px; padding-left: 24px; }
  article li { margin: 4px 0; }
  article li > ul, article li > ol { margin: 4px 0 0; }
  article :not(pre) > code { background: var(--surface2); border: 1px solid var(--border); border-radius: 5px;
    padding: 0.05em 0.35em; font-size: 0.88em; overflow-wrap: anywhere; }
  article pre { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px;
    margin: 0 0 18px; overflow-x: auto; font-size: 13.5px; line-height: 1.55; color: #e0e0e0; }
  article pre code { font-size: inherit; }
  article blockquote { margin: 0 0 16px; padding: 4px 16px; border-left: 3px solid #44444b; color: var(--muted); }
  article hr { border: 0; border-top: 1px solid var(--border); margin: 32px 0; }
  .table-wrap { overflow-x: auto; margin: 0 0 18px; border: 1px solid var(--border); border-radius: 8px; }
  article table { border-collapse: collapse; width: 100%; font-size: 14.5px; }
  article th, article td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
  article th { background: var(--surface); font-weight: 600; white-space: nowrap; }
  article tr:last-child td { border-bottom: 0; }
  .tok-c { color: #7d7d86; }
  .tok-k { color: #ffffff; font-weight: 600; }
  .tok-s { color: #c9c9a0; }

  .pager { display: flex; justify-content: space-between; gap: 16px; margin-top: 56px; padding-top: 24px; border-top: 1px solid var(--border); }
  .pager a { flex: 1; border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; text-decoration: none; }
  .pager a:hover { border-color: #55555c; }
  .pager span { display: block; font-size: 12.5px; color: var(--faint); font-family: var(--mono); }
  .pager .next { text-align: right; }
  .page-foot { margin-top: 18px; font-size: 13.5px; color: var(--faint); }
  .page-foot a { color: var(--muted); }

  aside.toc { position: sticky; top: var(--header); height: calc(100vh - var(--header)); overflow-y: auto; padding: 36px 20px 40px 8px; }
  aside.toc h4 { font-family: var(--mono); font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--faint); margin: 0 0 8px; }
  aside.toc a { display: block; color: var(--faint); text-decoration: none; font-size: 13.5px; line-height: 1.35; padding: 4px 0 4px 10px; border-left: 1px solid var(--border); }
  aside.toc a.h3 { padding-left: 22px; }
  aside.toc a:hover { color: var(--text); }
  aside.toc a.on { color: var(--text); border-left-color: var(--text); }

  .results h1 { font-size: 26px; }
  .result { display: block; text-decoration: none; border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; }
  .result:hover { border-color: #55555c; }
  .result b { display: block; font-weight: 600; }
  .result .where { font-family: var(--mono); font-size: 12px; color: var(--faint); }
  .result p { margin: 6px 0 0; color: var(--muted); font-size: 14.5px; }
  mark { background: var(--mark); color: var(--text); border-radius: 3px; padding: 0 1px; }
  .msg { color: var(--muted); }

  @media (max-width: 1180px) {
    .layout { grid-template-columns: 250px minmax(0, 1fr); }
    aside.toc { display: none; }
  }
  @media (max-width: 820px) {
    .navlinks { display: none; }
    .menu-btn { display: inline-block; }
    .layout { grid-template-columns: minmax(0, 1fr); }
    aside.side { position: fixed; z-index: 15; left: 0; right: 0; top: var(--header); height: calc(100vh - var(--header));
      background: var(--bg); border-right: 0; display: none; padding: 20px 16px 40px; }
    body.menu-open aside.side { display: block; }
    main { padding: 28px 16px 64px; }
    .pager { flex-direction: column; }
  }
</style>
</head>
<body>
<header>
  <nav class="top">
    <a class="logo" href="../"><img src="../assets/favicon-64.png" alt="" width="30" height="30">Anokos <small>docs</small></a>
    <div class="navlinks">
      <a href="../">Home</a>
      <a class="on" href="./">Docs</a>
      <a href="../code-map/">Code City</a>
      <a href="https://github.com/LandonDevAnokos/Anokos">GitHub</a>
    </div>
    <button class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="side">Contents</button>
  </nav>
</header>

<div class="layout">
  <aside class="side" id="side">
    <div class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search the docs" aria-label="Search the docs" autocomplete="off">
      <kbd>/</kbd>
    </div>
    <div id="navGroups"></div>
  </aside>
  <main>
    <article id="doc"><p class="msg">Loading...</p></article>
  </main>
  <aside class="toc" id="toc"></aside>
</div>

<script>
// The pages, in reading order. Each is docs/manual/<id>.md.
const PAGES = [
  { id: "README",      title: "Introduction",                     group: "Start here" },
  { id: "overview",    title: "How Anokos is put together",       group: "Start here" },
  { id: "language",    title: "The TerryC language",              group: "Start here" },
  { id: "build",       title: "Building Anokos",                  group: "Start here" },
  { id: "boot",        title: "Booting",                          group: "Kernel" },
  { id: "memory",      title: "Memory",                           group: "Kernel" },
  { id: "tasks",       title: "Tasks and scheduling",             group: "Kernel" },
  { id: "interrupts",  title: "Interrupts and timers",            group: "Kernel" },
  { id: "multicore",   title: "Multicore",                        group: "Kernel" },
  { id: "exceptions",  title: "Exceptions and the debugger",      group: "Kernel" },
  { id: "io",          title: "Input and output",                 group: "Kernel" },
  { id: "filesystem",  title: "Block devices and file systems",   group: "Kernel" },
  { id: "compiler",    title: "The compiler",                     group: "Compiler" },
  { id: "symbols",     title: "Symbols, hash tables and loading", group: "Compiler" },
  { id: "terminal",    title: "The Anokos terminal",              group: "System" },
  { id: "arm64",       title: "The ARM64 port",                   group: "Ports" },
];
const REPO = "https://github.com/LandonDevAnokos/Anokos/blob/main/docs/manual/";
const byId = Object.fromEntries(PAGES.map(p => [p.id, p]));
const cache = {};

// ---------- Markdown (the subset described in README.md) ----------
function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function slugify(text) {
  return text.toLowerCase().replace(/<[^>]+>/g, "").replace(/&[a-z]+;/g, "")
    .replace(/[^\p{L}\p{N}\s_-]/gu, "").trim().replace(/\s/g, "-");
}
function linkTarget(url) {
  if (/^[a-z]+:/i.test(url) || url.startsWith("//")) return { href: url, ext: true };
  if (url.startsWith("#")) return { href: "#" + current + ":" + url.slice(1) };
  const m = url.match(/^(?:\.\/)?([\w-]+)\.md(?:#(.*))?$/);
  if (m && byId[m[1]]) return { href: "#" + m[1] + (m[2] ? ":" + m[2] : "") };
  return { href: REPO + url, ext: true };
}
function inline(src) {
  const codes = [];
  let s = src.replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return "\u0000" + (codes.length - 1) + "\u0000"; });
  s = esc(s);
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, text, url) => {
    const t = linkTarget(url.replace(/&amp;/g, "&"));
    return '<a href="' + esc(t.href) + '"' + (t.ext ? ' target="_blank" rel="noopener"' : "") + ">" + text + "</a>";
  });
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/(^|[^\w*])\*([^*\s][^*]*?)\*(?![\w*])/g, "$1<em>$2</em>");
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => "<code>" + esc(codes[i]) + "</code>");
}
const KEYWORDS = new Set(("U0 I8 U8 I16 U16 I32 U32 I64 U64 F64 Bool if else while for do switch case break " +
  "return goto class union public extern _extern import try catch throw lock asm sizeof offset " +
  "interrupt no_warn default start end TRUE FALSE NULL").split(" "));
function highlight(code, lang) {
  const e = esc(code);
  if (!/^(c|tc|terryc|holyc)$/i.test(lang)) return e;
  return e.replace(/(\/\/[^\n]*)|(&quot;(?:[^&\\\n]|\\.|&(?!quot;))*&quot;|'(?:[^'\\\n]|\\.)*')|\b([A-Za-z_]\w*)\b/g,
    (m, c, str, word) => c ? '<span class="tok-c">' + c + "</span>"
      : str ? '<span class="tok-s">' + str + "</span>"
      : KEYWORDS.has(word) ? '<span class="tok-k">' + word + "</span>" : m);
}
function splitRow(line) {
  let s = line.trim();
  if (s.startsWith("|")) s = s.slice(1);
  if (s.endsWith("|") && !s.endsWith("\\|")) s = s.slice(0, -1);
  const cells = []; let cur = "", inCode = false;
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if (ch === "`") inCode = !inCode;
    if (ch === "\\" && s[i + 1] === "|") { cur += "|"; i++; continue; }
    if (ch === "|" && !inCode) { cells.push(cur.trim()); cur = ""; continue; }
    cur += ch;
  }
  cells.push(cur.trim());
  return cells;
}
const LIST_RE = /^(\s*)([-*]|\d+\.)\s+(.*)$/;
function renderList(lines, i) {
  // Returns [html, nextIndex]. Handles one nesting level by indent.
  const base = lines[i].match(LIST_RE)[1].length;
  const ordered = /\d/.test(lines[i].match(LIST_RE)[2]);
  const items = [];
  while (i < lines.length) {
    const line = lines[i];
    if (!line.trim()) {
      const nxt = lines[i + 1];
      if (nxt && (LIST_RE.test(nxt) && nxt.match(LIST_RE)[1].length >= base ||
          /^\s+\S/.test(nxt) && nxt.search(/\S/) > base)) { i++; continue; }
      break;
    }
    const m = line.match(LIST_RE);
    if (m && m[1].length === base) { items.push({ text: m[3], sub: [] }); i++; continue; }
    if (m && m[1].length > base && items.length) {
      const [sub, j] = renderList(lines, i);
      items[items.length - 1].sub.push(sub); i = j; continue;
    }
    if (!m && line.search(/\S/) > base && items.length) { items[items.length - 1].text += " " + line.trim(); i++; continue; }
    break;
  }
  const tag = ordered ? "ol" : "ul";
  return ["<" + tag + ">" + items.map(it => "<li>" + inline(it.text) + it.sub.join("") + "</li>").join("") +
    "</" + tag + ">", i];
}
function renderMarkdown(md) {
  const lines = md.replace(/\r\n?/g, "\n").split("\n");
  const out = [], headings = [], seen = {};
  let i = 0;
  const isBlockStart = l => /^(#{1,4})\s/.test(l) || /^```/.test(l) || /^>\s?/.test(l) || LIST_RE.test(l) ||
    /^\s*\|/.test(l) || /^-{3,}\s*$/.test(l);
  while (i < lines.length) {
    const line = lines[i];
    if (!line.trim()) { i++; continue; }
    let m;
    if ((m = line.match(/^```\s*([\w+-]*)/))) {
      const lang = m[1] || "", buf = [];
      i++;
      while (i < lines.length && !/^```\s*$/.test(lines[i])) buf.push(lines[i++]);
      i++;
      out.push("<pre><code>" + highlight(buf.join("\n"), lang) + "</code></pre>");
      continue;
    }
    if ((m = line.match(/^(#{1,4})\s+(.*?)\s*#*\s*$/))) {
      const level = m[1].length, html = inline(m[2]);
      let id = slugify(html);
      if (seen[id] !== undefined) id += "-" + (++seen[id]); else seen[id] = 0;
      if (level === 1) out.push("<h1>" + html + "</h1>");
      else {
        out.push("<h" + level + ' id="' + id + '">' + html +
          (level < 4 ? '<a class="anchor" href="#' + current + ":" + id + '" aria-label="Link to this section">#</a>' : "") +
          "</h" + level + ">");
        if (level <= 3) headings.push({ level, id, text: html.replace(/<[^>]+>/g, "") });
      }
      i++; continue;
    }
    if (/^-{3,}\s*$/.test(line)) { out.push("<hr>"); i++; continue; }
    if (/^\s*\|/.test(line) && i + 1 < lines.length && /^\s*\|?\s*:?-{3,}/.test(lines[i + 1])) {
      const head = splitRow(line);
      const aligns = splitRow(lines[i + 1]).map(c => c.startsWith(":") && c.endsWith(":") ? "center" : c.endsWith(":") ? "right" : "");
      i += 2;
      const rows = [];
      while (i < lines.length && /^\s*\|/.test(lines[i])) rows.push(splitRow(lines[i++]));
      const cell = (tag, c, k) => "<" + tag + (aligns[k] ? ' style="text-align:' + aligns[k] + '"' : "") + ">" + inline(c) + "</" + tag + ">";
      out.push('<div class="table-wrap"><table><thead><tr>' + head.map((c, k) => cell("th", c, k)).join("") +
        "</tr></thead><tbody>" + rows.map(r => "<tr>" + head.map((_, k) => cell("td", r[k] || "", k)).join("") + "</tr>").join("") +
        "</tbody></table></div>");
      continue;
    }
    if (/^>\s?/.test(line)) {
      const buf = [];
      while (i < lines.length && /^>\s?/.test(lines[i])) buf.push(lines[i++].replace(/^>\s?/, ""));
      out.push("<blockquote>" + renderMarkdown(buf.join("\n")).html + "</blockquote>");
      continue;
    }
    if (LIST_RE.test(line)) {
      const [html, j] = renderList(lines, i);
      out.push(html); i = j; continue;
    }
    const buf = [];
    while (i < lines.length && lines[i].trim() && !(buf.length && isBlockStart(lines[i]))) buf.push(lines[i++].trim());
    out.push("<p>" + inline(buf.join(" ")) + "</p>");
  }
  return { html: out.join("\n"), headings };
}

// ---------- Navigation ----------
let current = "README";
const $ = id => document.getElementById(id);
function buildNav() {
  const groups = [];
  for (const p of PAGES) {
    let g = groups.find(g => g.name === p.group);
    if (!g) groups.push(g = { name: p.group, pages: [] });
    g.pages.push(p);
  }
  $("navGroups").innerHTML = groups.map(g => '<div class="group"><h4>' + esc(g.name) + "</h4>" +
    g.pages.map(p => '<a href="#' + p.id + '" data-id="' + p.id + '">' + esc(p.title) + "</a>").join("") + "</div>").join("");
}
async function fetchPage(id) {
  if (cache[id] !== undefined) return cache[id];
  const r = await fetch(id + ".md", { cache: "no-cache" });
  if (!r.ok) throw new Error(r.status + " " + r.statusText);
  return (cache[id] = await r.text());
}
function parseHash() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (h.startsWith("search=")) return { search: h.slice(7) };
  const [id, anchor] = h.split(":");
  return { id: byId[id] ? id : "README", anchor };
}
let tocObserver = null;
async function show(id, anchor) {
  const page = byId[id];
  const changed = id !== current || !$("doc").dataset.loaded;
  current = id;
  document.querySelectorAll(".group a").forEach(a => a.classList.toggle("on", a.dataset.id === id));
  document.body.classList.remove("menu-open");
  $("menuBtn").setAttribute("aria-expanded", "false");
  if (changed) {
    let md;
    try { md = await fetchPage(id); }
    catch (e) {
      $("doc").innerHTML = '<h1>' + esc(page.title) + '</h1><p class="msg">Couldn\'t load <code>' + esc(id) +
        '.md</code> (' + esc(e.message) + "). If you opened this file directly from disk, serve the site instead: " +
        "<code>python -m http.server --directory docs</code>, then open <code>http://localhost:8000/manual/</code>.</p>";
      $("toc").innerHTML = "";
      return;
    }
    const { html, headings } = renderMarkdown(md);
    const k = PAGES.indexOf(page), prev = PAGES[k - 1], next = PAGES[k + 1];
    $("doc").innerHTML = '<div class="crumbs">' + esc(page.group) + "</div>" + html +
      '<div class="pager">' +
      (prev ? '<a href="#' + prev.id + '"><span>Previous</span>' + esc(prev.title) + "</a>" : "<div></div>") +
      (next ? '<a class="next" href="#' + next.id + '"><span>Next</span>' + esc(next.title) + "</a>" : "<div></div>") +
      "</div>" + '<p class="page-foot"><a href="' + REPO + id + '.md" target="_blank" rel="noopener">View or edit ' + esc(id) +
      ".md on GitHub</a></p>";
    $("doc").dataset.loaded = "1";
    const h1 = $("doc").querySelector("h1");
    document.title = (h1 ? h1.textContent : page.title) + " - Anokos Docs";
    const toc = headings.filter(h => h.level <= 3);
    $("toc").innerHTML = toc.length ? "<h4>On this page</h4>" + toc.map(h =>
      '<a class="' + (h.level === 3 ? "h3" : "") + '" href="#' + id + ":" + h.id + '" data-h="' + h.id + '">' + esc(h.text) + "</a>").join("") : "";
    if (tocObserver) tocObserver.disconnect();
    tocObserver = new IntersectionObserver(entries => {
      for (const en of entries) if (en.isIntersecting) {
        document.querySelectorAll("#toc a").forEach(a => a.classList.toggle("on", a.dataset.h === en.target.id));
      }
    }, { rootMargin: "-70px 0px -70% 0px" });
    $("doc").querySelectorAll("h2[id], h3[id]").forEach(h => tocObserver.observe(h));
  }
  const target = anchor && document.getElementById(anchor);
  if (target) target.scrollIntoView();
  else if (changed) window.scrollTo(0, 0);
}

// ---------- Search ----------
let index = null;
async function buildIndex() {
  if (index) return index;
  const texts = await Promise.all(PAGES.map(p => fetchPage(p.id).catch(() => "")));
  index = [];
  PAGES.forEach((p, k) => {
    let sec = { page: p, id: "", title: p.title, body: [] };
    const push = () => { if (sec.body.length || sec.id === "") index.push({ ...sec, text: sec.body.join(" ") }); };
    let inCode = false;
    for (const line of texts[k].split("\n")) {
      if (/^```/.test(line)) { inCode = !inCode; continue; }
      const m = !inCode && line.match(/^(#{2,3})\s+(.*)$/);
      if (m) {
        push();
        sec = { page: p, id: slugify(esc(m[2].replace(/`/g, ""))), title: m[2].replace(/[`*]/g, ""), body: [] };
      } else if (!/^#\s/.test(line)) sec.body.push(line.replace(/[`*|>#]/g, " ").replace(/\[([^\]]*)\]\([^)]*\)/g, "$1"));
    }
    push();
  });
  return index;
}
function markTerms(text, terms) {
  let s = esc(text);
  for (const t of terms) s = s.replace(new RegExp("(" + t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi"), "<mark>$1</mark>");
  return s;
}
async function search(q) {
  const terms = q.toLowerCase().split(/\s+/).filter(Boolean);
  current = "";
  $("doc").dataset.loaded = "";
  $("toc").innerHTML = "";
  document.querySelectorAll(".group a").forEach(a => a.classList.remove("on"));
  if (!terms.length) { $("doc").innerHTML = '<p class="msg">Type to search.</p>'; return; }
  $("doc").innerHTML = '<p class="msg">Searching...</p>';
  const idx = await buildIndex();
  const hits = [];
  for (const s of idx) {
    const title = s.title.toLowerCase(), text = s.text.toLowerCase(), pageT = s.page.title.toLowerCase();
    if (!terms.every(t => title.includes(t) || text.includes(t) || pageT.includes(t))) continue;
    let score = 0;
    for (const t of terms) {
      if (title.includes(t)) score += 10;
      if (pageT.includes(t)) score += 4;
      score += Math.min(5, text.split(t).length - 1);
    }
    hits.push({ s, score });
  }
  hits.sort((a, b) => b.score - a.score);
  const shown = hits.slice(0, 40);
  $("doc").innerHTML = '<div class="results"><h1>Search</h1><p class="msg">' + hits.length + " result" + (hits.length === 1 ? "" : "s") +
    " for <strong>" + esc(q) + "</strong></p>" + shown.map(({ s }) => {
      const lower = s.text.toLowerCase();
      const at = Math.max(0, Math.min(...terms.map(t => { const k = lower.indexOf(t); return k < 0 ? Infinity : k; })) - 60);
      const snip = (at > 0 ? "..." : "") + s.text.slice(at, at + 220).replace(/\s+/g, " ").trim() + "...";
      return '<a class="result" href="#' + s.page.id + (s.id ? ":" + s.id : "") + '"><span class="where">' + esc(s.page.title) +
        "</span><b>" + markTerms(s.title, terms) + "</b><p>" + markTerms(snip, terms) + "</p></a>";
    }).join("") + "</div>";
  document.title = "Search - Anokos Docs";
}

// ---------- Wiring ----------
function route() {
  const r = parseHash();
  if (r.search !== undefined) { $("q").value = r.search; search(r.search); }
  else show(r.id, r.anchor);
}
let searchTimer = 0;
$("q").addEventListener("input", e => {
  clearTimeout(searchTimer);
  const v = e.target.value;
  searchTimer = setTimeout(() => {
    if (v.trim()) history.replaceState(null, "", "#search=" + encodeURIComponent(v));
    else history.replaceState(null, "", "#" + (current || "README"));
    route();
  }, 160);
});
$("q").addEventListener("focus", () => buildIndex());
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== $("q")) { e.preventDefault(); $("q").focus(); }
  if (e.key === "Escape" && document.activeElement === $("q")) { $("q").value = ""; $("q").blur(); history.replaceState(null, "", "#README"); route(); }
});
$("menuBtn").addEventListener("click", () => {
  const open = document.body.classList.toggle("menu-open");
  $("menuBtn").setAttribute("aria-expanded", String(open));
});
$("navGroups").addEventListener("click", () => { $("q").value = ""; });
window.addEventListener("hashchange", route);
buildNav();
route();
</script>
