<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anokos Code City</title>
<meta name="description" content="Fly over the complete Anokos source code as a city: every folder is a block, every file a building, and you can zoom in far enough to read every line.">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="../assets/favicon-64.png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #08090b;
    --panel: #111317;
    --panel-2: #0c0d10;
    --border: #24272d;
    --text: #e9eaec;
    --muted: #9ea3ab;
    --faint: #626872;
    --hit: #ffd54f;
    --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
    --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --side: 380px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.45 var(--sans); overflow: hidden; }
  a { color: inherit; }
  button { font: inherit; color: inherit; }

  #app { position: fixed; inset: 0; display: grid; grid-template-columns: 1fr var(--side); grid-template-rows: 44px 1fr; }
  #topbar { grid-column: 1 / 3; display: flex; align-items: center; gap: 14px; padding: 0 14px;
    background: var(--panel); border-bottom: 1px solid var(--border); min-width: 0; }
  #topbar h1 { margin: 0; font: 600 14px var(--mono); white-space: nowrap; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 7px; overflow: hidden; }
  .seg button { background: none; border: 0; padding: 4px 11px; cursor: pointer; color: var(--muted); font-size: 12.5px; }
  .seg button.on { background: #24272d; color: var(--text); }
  .toplinks { margin-left: auto; display: flex; gap: 14px; font-size: 12.5px; white-space: nowrap; }
  .toplinks a { color: var(--muted); text-decoration: none; }
  .toplinks a:hover { color: var(--text); }
  #stats { color: var(--faint); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  #view { position: relative; overflow: hidden; min-width: 0; }
  #view canvas { display: block; touch-action: none; }
  #labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .lbl { position: absolute; top: 0; left: 0; font: 600 11.5px var(--mono); color: #f2f2f2; white-space: nowrap;
    text-shadow: 0 0 3px #000, 0 0 2px #000, 0 0 1px #000; will-change: transform; pointer-events: none; }
  .lbl.file { font-weight: 400; color: #d5d8dc; font-size: 11px; background: rgba(16, 18, 22, 0.82); padding: 0 4px; border-radius: 3px; }
  #crumb { position: absolute; left: 10px; bottom: 8px; font: 12px var(--mono); color: var(--muted);
    background: rgba(8, 9, 11, 0.8); padding: 3px 8px; border-radius: 6px; pointer-events: none; max-width: calc(100% - 20px);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #tip { position: absolute; pointer-events: none; display: none; background: #0c0d10; border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 9px; max-width: 520px; font-size: 12px; z-index: 3; }
  #tip .path { color: var(--muted); font-family: var(--mono); font-size: 11.5px; }
  #tip pre { margin: 4px 0 0; font: 12px var(--mono); color: var(--text); white-space: pre; overflow: hidden; text-overflow: ellipsis; }
  #loading { position: absolute; inset: 0; display: grid; place-items: center; background: var(--bg); color: var(--muted);
    font: 13px var(--mono); z-index: 5; }

  #side { background: var(--panel); border-left: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
  .search { padding: 10px; border-bottom: 1px solid var(--border); }
  .search input { width: 100%; padding: 8px 10px; border-radius: 7px; border: 1px solid var(--border); background: var(--panel-2);
    color: var(--text); font: 13px var(--mono); outline: none; }
  .search input:focus { border-color: #4a4f58; }
  .tabs { display: flex; gap: 2px; padding: 6px 10px 0; border-bottom: 1px solid var(--border); }
  .tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 6px 10px; color: var(--muted); cursor: pointer; font-size: 12.5px; }
  .tabs button.on { color: var(--text); border-bottom-color: var(--text); }
  .pane { flex: 1; overflow-y: auto; padding: 12px; display: none; min-height: 0; }
  .pane.on { display: block; }
  .empty { color: var(--faint); line-height: 1.6; }
  .empty kbd { font: 11px var(--mono); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; color: var(--muted); }
  h2 { margin: 0 0 2px; font: 600 15px var(--mono); word-break: break-all; }
  h3 { margin: 14px 0 6px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: var(--faint); }
  .sub { color: var(--muted); font-size: 12px; }
  .sub a { color: var(--muted); }
  .code { font: 12px/1.5 var(--mono); background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px;
    padding: 8px 0; margin-top: 8px; overflow-x: auto; white-space: pre; }
  .code div { padding: 0 10px; }
  .code .cur { background: rgba(255, 213, 79, 0.14); }
  .code .ln { color: var(--faint); display: inline-block; min-width: 3.5em; user-select: none; }
  .row { display: flex; gap: 8px; align-items: baseline; padding: 4px 6px; border-radius: 5px; cursor: pointer; font: 12px var(--mono); }
  .row:hover, .row.on { background: #1c1f24; }
  .row .ln { color: var(--faint); min-width: 3.2em; text-align: right; flex: none; }
  .row .txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #d5d8dc; }
  .row .tag { margin-left: auto; color: var(--faint); font-size: 11px; white-space: nowrap; padding-left: 6px; }
  .filehead { font: 11.5px var(--mono); color: var(--muted); margin: 10px 6px 2px; word-break: break-all; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip { font: 11.5px var(--mono); padding: 2px 7px; border-radius: 5px; background: #1a1d22; border: 1px solid #262a30;
    cursor: pointer; color: #dadde1; }
  .chip:hover { border-color: #4a4f58; }
  .more { color: var(--faint); font-size: 11.5px; padding: 2px 4px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: 6px; font-size: 12px; color: var(--muted); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  #toggle-side { display: none; }

  @media (max-width: 820px) {
    #app { grid-template-columns: 1fr; grid-template-rows: 44px 1fr auto; }
    #topbar { grid-column: 1; }
    #stats, .toplinks .hide-sm { display: none; }
    #side { border-left: 0; border-top: 1px solid var(--border); max-height: 46vh; }
    #side.collapsed .tabs, #side.collapsed .pane { display: none; }
    #toggle-side { display: inline-block; background: none; border: 1px solid var(--border); border-radius: 6px; padding: 2px 8px;
      color: var(--muted); font-size: 12px; margin-left: 8px; }
    .search { display: flex; align-items: center; }
  }
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <a href="../" style="display:inline-flex"><img src="../assets/favicon-64.png" alt="Anokos home" width="24" height="24"></a>
    <h1>Anokos Code City</h1>
    <div class="seg" role="group" aria-label="View">
      <button id="mode2d" class="on" type="button">Map</button>
      <button id="mode3d" type="button">3D</button>
    </div>
    <div class="seg" role="group" aria-label="Camera">
      <button id="fit" type="button" title="Show everything">Fit</button>
    </div>
    <span id="stats"></span>
    <nav class="toplinks">
      <a href="graph.html">Graph view</a>
      <a class="hide-sm" href="https://github.com/LandonDevAnokos/Anokos">GitHub</a>
      <a href="../">Home</a>
    </nav>
  </header>
  <main id="view">
    <div id="labels"></div>
    <div id="crumb">Anokos</div>
    <div id="tip"></div>
    <div id="loading">Loading source...</div>
  </main>
  <aside id="side" class="collapsed">
    <div class="search">
      <input id="q" type="search" placeholder="Search symbol or text, e.g. KMain" autocomplete="off" spellcheck="false" aria-label="Search the source">
      <button id="toggle-side" type="button">Panel</button>
    </div>
    <div class="tabs" role="tablist">
      <button data-tab="inspector" class="on" type="button" role="tab">Inspector</button>
      <button data-tab="results" type="button" role="tab">Results</button>
    </div>
    <div id="inspector" class="pane on"></div>
    <div id="results" class="pane"></div>
  </aside>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

// ------------------------------------------------------------------ constants
const CW = 0.6;            // char width, in line heights
const COL_CHARS = 88;      // code column width in chars
const COL_GAP = 3;         // gap between columns, in line heights
const COL_W = COL_CHARS * CW;
const COL_STRIDE = COL_W + COL_GAP;
const SLAB = 9;            // folder platform step height (3D)
const MAX_DETAIL = matchMedia("(max-width: 820px)").matches ? 10 : 22;
const TOP_COLORS = { Kernel: "#26a69a", Anokos: "#43a047", Compiler: "#3f7fd8", Apps: "#8e63ce",
  Demo: "#e08a2c", Misc: "#c7a326", Doc: "#7a8796", "": "#5b6b7a" };
const SYN = ["#c9ccd1", "#c792ea", "#ffcb6b", "#a5d6a7", "#5f6b7a", "#f78c6c", "#82aaff", "#8b919a"]; // text kw type str comment num preproc punct
const KW = new Set(("if else while for do switch case default break return goto try catch throw sizeof offset class union " +
  "public static extern _extern import _import intern _intern asm interrupt lock reg noreg no_warn lastclass start end " +
  "TRUE FALSE NULL ON OFF").split(" "));
const TY = new Set("U0 I0 U8 I8 U16 I16 U32 I32 U64 I64 F64 Bool U8i I8i U16i I16i U32i I32i U64i I64i F64i".split(" "));
const EDGE_COLORS = { calls: "#4fc3f7", uses: "#ffd54f", type: "#ce93d8", inherits: "#f48fb1", includes: "#ffffff", runs: "#81c784" };
const EDGE_TEXT = {
  out: { calls: "Calls", uses: "Uses", type: "Uses types", inherits: "Inherits from", includes: "Includes", runs: "Runs" },
  in:  { calls: "Called by", uses: "Used by", type: "Used as a type by", inherits: "Inherited by", includes: "Included by", runs: "Run by" },
};
const REPO = "https://github.com/LandonDevAnokos/Anokos/blob/main/src/";
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const loading = document.getElementById("loading");
const tick = () => new Promise(r => setTimeout(r, 0));

// ------------------------------------------------------------------ data
const [map, src] = await Promise.all([
  fetch("codemap.json").then(r => r.json()),
  fetch("source.json").then(r => r.json()),
]);
await document.fonts.load('16px "IBM Plex Mono"').catch(() => {});
loading.textContent = "Reading 117,000 lines...";
await tick();

const FILES = src.files.map((path, i) => {
  const lines = src.text[i].split("\n");
  return { i, path, name: path.split("/").pop(), top: path.includes("/") ? path.split("/")[0] : "", lines, n: lines.length };
});

// syntax runs per file: flat Uint16Array of [start,end,class] with a per-line index
function lex(file) {
  const out = [], idx = new Uint32Array(file.n + 1);
  let block = false;
  for (let li = 0; li < file.n; li++) {
    idx[li] = out.length;
    const ln = file.lines[li], n = ln.length;
    let i = 0;
    if (!block && /^\s*#/.test(ln)) {
      ln.replace(/\S+/g, (m, at) => { out.push(at, at + m.length, 6); return m; });
      continue;
    }
    while (i < n) {
      const c = ln[i];
      if (block) {
        const e = ln.indexOf("*/", i);
        const end = e < 0 ? n : e + 2;
        out.push(i, end, 4); i = end;
        if (e >= 0) block = false;
      } else if (c === " ") { i++; }
      else if (c === "/" && ln[i + 1] === "/") { out.push(i, n, 4); i = n; }
      else if (c === "/" && ln[i + 1] === "*") {
        const e = ln.indexOf("*/", i + 2);
        const end = e < 0 ? n : e + 2;
        out.push(i, end, 4); i = end;
        if (e < 0) block = true;
      } else if (c === '"' || c === "'") {
        let j = i + 1;
        while (j < n && ln[j] !== c) { if (ln[j] === "\\") j++; j++; }
        j = Math.min(n, j + 1); out.push(i, j, 3); i = j;
      } else if (c >= "0" && c <= "9") {
        let j = i + 1; while (j < n && /[\w.]/.test(ln[j])) j++;
        out.push(i, j, 5); i = j;
      } else if (/[A-Za-z_]/.test(c)) {
        let j = i + 1; while (j < n && /\w/.test(ln[j])) j++;
        const w = ln.slice(i, j);
        out.push(i, j, KW.has(w) ? 1 : (TY.has(w) || /^C[A-Z][a-z]/.test(w)) ? 2 : 0); i = j;
      } else {
        let j = i + 1; while (j < n && /[^\sA-Za-z0-9_"'/]/.test(ln[j])) j++;
        out.push(i, j, 7); i = j;
      }
    }
  }
  idx[file.n] = out.length;
  file.runs = Uint16Array.from(out, v => Math.min(v, 65535));
  file.ridx = idx;
}
for (let k = 0; k < FILES.length; k++) { lex(FILES[k]); if (k % 60 === 0) await tick(); }

// ------------------------------------------------------------------ treemap
const root = { name: "Anokos", path: "", dirs: new Map(), files: [], depth: 0, parent: null };
for (const f of FILES) {
  let d = root;
  const parts = f.path.split("/");
  for (let k = 0; k < parts.length - 1; k++) {
    if (!d.dirs.has(parts[k]))
      d.dirs.set(parts[k], { name: parts[k], path: parts.slice(0, k + 1).join("/"), dirs: new Map(), files: [], depth: d.depth + 1, parent: d });
    d = d.dirs.get(parts[k]);
  }
  d.files.push(f);
  f.dir = d;
}
const DIRS = [];
(function weigh(d) {
  DIRS.push(d);
  let w = 0;
  for (const s of d.dirs.values()) w += weigh(s);
  for (const f of d.files) { f.w = Math.max(f.n, 12) * COL_STRIDE * 1.1; w += f.w; }
  d.w = w * 1.06 + 400;
  return d.w;
})(root);

function squarify(items, x, y, w, h) {
  const total = items.reduce((s, it) => s + it.w, 0);
  const scale = (w * h) / total;
  const list = items.slice().sort((a, b) => b.w - a.w);
  let i = 0;
  while (i < list.length) {
    const short = Math.min(w, h);
    let sum = list[i].w * scale, j = i + 1;
    const worst = (s, mx, mn) => Math.max(short * short * mx / (s * s), (s * s) / (short * short * mn));
    let cur = worst(sum, list[i].w * scale, list[i].w * scale);
    while (j < list.length) {
      const a = list[j].w * scale, s2 = sum + a;
      const nw = worst(s2, list[i].w * scale, a);
      if (nw > cur) break;
      cur = nw; sum = s2; j++;
    }
    const thick = sum / short;
    let off = 0;
    for (let k = i; k < j; k++) {
      const len = (list[k].w * scale) / thick;
      list[k].r = w >= h ? { x, y: y + off, w: thick, h: len } : { x: x + off, y, w: len, h: thick };
      off += len;
    }
    if (w >= h) { x += thick; w -= thick; } else { y += thick; h -= thick; }
    i = j;
  }
}
const WORLD = Math.sqrt(root.w);
function layout(d, r) {
  d.r = r;
  const pad = Math.min(Math.max(Math.sqrt(r.w * r.h) * 0.012, 1.2), 16);
  const side = Math.sqrt(r.w * r.h);
  const head = d.depth === 0 ? pad : Math.min(Math.max(side * (d.depth === 1 ? 0.034 : 0.03), 3), 70);
  d.head = head;
  const inner = { x: r.x + pad, y: r.y + head, w: Math.max(1, r.w - 2 * pad), h: Math.max(1, r.h - head - pad) };
  const items = [...d.dirs.values(), ...d.files];
  if (items.length) squarify(items, inner.x, inner.y, inner.w, inner.h);
  for (const s of d.dirs.values()) layout(s, s.r);
  for (const f of d.files) {
    const g = Math.min(Math.max(Math.min(f.r.w, f.r.h) * 0.025, 0.4), 3);
    f.r = { x: f.r.x + g, y: f.r.y + g, w: Math.max(0.5, f.r.w - 2 * g), h: Math.max(0.5, f.r.h - 2 * g) };
    fitCode(f);
  }
}
function fitCode(f) {
  const m = 0.8;
  const W = f.r.w - 2 * m, H = f.r.h - 2 * m;
  let lo = 0.01, hi = 8;
  for (let it = 0; it < 40; it++) {
    const fs = (lo + hi) / 2;
    const cols = Math.max(1, Math.floor((W + COL_GAP * fs) / (COL_STRIDE * fs)));
    const rows = Math.floor(H / fs);
    if (rows >= 1 && cols * rows >= f.n) lo = fs; else hi = fs;
  }
  f.fs = lo;
  f.cols = Math.max(1, Math.floor((W + COL_GAP * lo) / (COL_STRIDE * lo)));
  f.rows = Math.max(1, Math.ceil(f.n / f.cols));
  f.ox = f.r.x + m; f.oz = f.r.y + m;
}
layout(root, { x: 0, y: 0, w: WORLD, h: WORLD });

// heights
for (const f of FILES) f.bh = 10 + 24 * Math.log10(f.n + 1);
let HS = 0.03;  // height scale: ~0 for the flat map, 1 for 3D
const dirTop = d => (d.depth + 1) * SLAB * HS;
const fileBase = f => dirTop(f.dir);
const fileTop = f => fileBase(f) + f.bh * HS;

// position of a line inside a file, in world units
function linePos(f, line) {
  const k = Math.max(0, Math.min(f.n - 1, line - 1));
  const col = Math.floor(k / f.rows), row = k % f.rows;
  return { x: f.ox + col * COL_STRIDE * f.fs, z: f.oz + row * f.fs, w: COL_W * f.fs, h: f.fs };
}

// ------------------------------------------------------------------ three.js scene
const view = document.getElementById("view");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0x08090b, 1);
view.prepend(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 1, 100000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.12;
controls.screenSpacePanning = true;
controls.zoomToCursor = true;
controls.zoomSpeed = 2.2;
controls.minDistance = 4;
controls.maxDistance = WORLD * 4;

// atlas: the whole city drawn top-down, code as colored bars
loading.textContent = "Drawing the city...";
await tick();
const maxTex = renderer.capabilities.maxTextureSize;
const ATLAS = Math.min(4096, maxTex);
const atlasCanvas = document.createElement("canvas");
atlasCanvas.width = atlasCanvas.height = ATLAS;
{
  const ctx = atlasCanvas.getContext("2d");
  const a = ATLAS / WORLD;
  ctx.fillStyle = "#101216";
  for (const f of FILES) ctx.fillRect(f.r.x * a, f.r.y * a, f.r.w * a, f.r.h * a);
  const paths = SYN.map(() => new Path2D());
  for (const f of FILES) {
    const fs = f.fs, stride = COL_STRIDE * fs;
    for (let li = 0; li < f.n; li++) {
      const col = Math.floor(li / f.rows), row = li % f.rows;
      const x0 = (f.ox + col * stride) * a, y0 = (f.oz + (row + 0.2) * fs) * a, bh = Math.max(0.35, 0.62 * fs * a);
      for (let k = f.ridx[li]; k < f.ridx[li + 1]; k += 3) {
        const s = f.runs[k], e = Math.min(f.runs[k + 1], COL_CHARS);
        if (s >= COL_CHARS) break;
        paths[f.runs[k + 2]].rect(x0 + s * CW * fs * a, y0, (e - s) * CW * fs * a, bh);
      }
    }
  }
  paths.forEach((p, c) => { ctx.fillStyle = SYN[c]; ctx.globalAlpha = c === 4 ? 0.7 : 0.9; ctx.fill(p); });
  ctx.globalAlpha = 1;
}
const atlasTex = new THREE.CanvasTexture(atlasCanvas);
atlasTex.colorSpace = THREE.SRGBColorSpace;
atlasTex.anisotropy = renderer.capabilities.getMaxAnisotropy();
atlasTex.generateMipmaps = true;
atlasTex.minFilter = THREE.LinearMipmapLinearFilter;

const boxGeo = new THREE.BoxGeometry(1, 1, 1);
boxGeo.translate(0, 0.5, 0);
const vert = `
  attribute vec4 aUv; attribute vec3 aTint;
  varying vec2 vUv; varying vec3 vN; varying vec3 vTint;
  void main() {
    vN = normal; vTint = aTint;
    vUv = vec2(mix(aUv.x, aUv.z, uv.x), mix(aUv.y, aUv.w, uv.y));
    vec4 p = vec4(position, 1.0);
    #ifdef USE_INSTANCING
      p = instanceMatrix * p;
    #endif
    gl_Position = projectionMatrix * modelViewMatrix * p;
  }`;
const frag = (textured) => `
  uniform sampler2D atlas; varying vec2 vUv; varying vec3 vN; varying vec3 vTint;

      for (let k = 0; k < curve.length - 1; k++) {
        pts.push(curve[k].x, curve[k].y, curve[k].z, curve[k + 1].x, curve[k + 1].y, curve[k + 1].z);
        cols.push(c.r, c.g, c.b, c.r, c.g, c.b);
      }
    }
  }
  arcs.geometry.dispose();
  arcs.geometry = new THREE.BufferGeometry();
  arcs.geometry.setAttribute("position", new THREE.Float32BufferAttribute(pts, 3));
  arcs.geometry.setAttribute("color", new THREE.Float32BufferAttribute(cols, 3));
}
function updateSelection() {
  selLines.geometry.dispose();
  selLines.geometry = selected ? rectLines([[selected.f.r, fileTop(selected.f) + 0.04]]) : new THREE.BufferGeometry();
  buildArcs(selected ? selected.node : -1);
}
function codeBlock(f, line, before = 3, after = 8) {
  const a = Math.max(1, line - before), b = Math.min(f.n, line + after);
  let h = "";
  for (let l = a; l <= b; l++)
    h += `<div class="${l === line ? "cur" : ""}"><span class="ln">${l}</span>${esc(f.lines[l - 1]) || " "}</div>`;
  return `<div class="code">${h}</div>`;
}
function chip(i) { return `<span class="chip" data-node="${i}">${esc(NODES[i][1])}</span>`; }
function group(title, list) {
  if (!list.length) return "";
  return `<h3>${esc(title)} (${list.length})</h3><div class="chips">${list.slice(0, 120).join("")}${list.length > 120 ? `<span class="more">and ${list.length - 120} more</span>` : ""}</div>`;
}
function select(f, line, fly) {
  if (!f) { selected = null; updateSelection(); renderInspector(); redrawDetails(); return; }
  selected = { f, line, node: symbolAt(f.i, line) };
  updateSelection();
  redrawDetails();
  renderInspector();
  showTab("inspector");
  if (fly) flyToLine(f, line);
}
function renderInspector() {
  if (!selected) {
    inspector.innerHTML = `<div class="empty">
      <p>Every folder is a block and every file is a building, sized by its number of lines and covered in its own code.
      Zoom in to read it.</p>
      <p><kbd>Scroll</kbd> zoom &middot; <kbd>Drag</kbd> move &middot; <kbd>Click</kbd> inspect a line &middot;
      <kbd>Double-click</kbd> zoom to it. Switch to <b>3D</b> to tilt the city and see folders as raised blocks.</p>
      <h3>Folders</h3><div class="legend">${Object.entries(TOP_COLORS).filter(([k]) => k)
        .map(([k, c]) => `<span><i style="background:${c}"></i>${k}/</span>`).join("")}</div>
      <h3>Code colors</h3><div class="legend">${["Keywords", "Types", "Strings", "Comments", "Numbers", "Preprocessor"]
        .map((t, k) => `<span><i style="background:${SYN[k + 1]}"></i>${t}</span>`).join("")}</div>
    </div>`;
    return;
  }
  const { f, line, node } = selected;
  let h = `<h2>${esc(f.name)}</h2><div class="sub"><a href="${REPO}${f.path.split("/").map(encodeURIComponent).join("/")}#L${line}" target="_blank" rel="noopener">src/${esc(f.path)}:${line}</a> &middot; ${f.n} lines</div>`;
  h += codeBlock(f, line);
  if (node >= 0) {
    const n = NODES[node], d = DET[node] || {}, kind = KINDS[n[0]];
    h += `<h3>${esc(kind === "global" ? "global variable" : kind === "asm" ? "asm label" : kind)}</h3>
      <h2 style="font-size:14px">${esc(n[1])}</h2>`;
    if (d.sig) h += `<div class="code"><div>${esc(d.sig)}</div></div>`;
    if (d.params) h += group("Parameters", d.params.map(p => `<span class="chip">${esc(p)}</span>`));
    if (d.locals) h += group("Local variables", d.locals.map(([nm, l]) => `<span class="chip" data-line="${l}">${esc(nm)}<span style="color:var(--faint)">:${l}</span></span>`));
    if (d.members) h += group("Members", d.members.map(([nm, l]) => `<span class="chip" data-line="${l}">${esc(nm)}</span>`));
    for (const dir of ["out", "in"]) for (let t = 0; t < EK.length; t++) {
      const ids = [...new Set((dir === "out" ? outAdj : inAdj)[node].filter(e => e[1] === t).map(e => e[0]))]
        .sort((a, b) => NODES[a][1].localeCompare(NODES[b][1]));
      h += group(EDGE_TEXT[dir][EK[t]], ids.map(chip));
    }
    if (outAdj[node].length + inAdj[node].length)
      h += `<p class="sub" style="margin-top:12px">Arcs in the city show these connections.</p>`;
  }
  inspector.innerHTML = h;
  inspector.scrollTop = 0;
}
inspector.addEventListener("click", e => {
  const c = e.target.closest("[data-node]");
  if (c) { const i = +c.dataset.node; select(nodeFile(i), NODES[i][3], true); return; }
  const l = e.target.closest("[data-line]");
  if (l && selected) select(selected.f, +l.dataset.line, true);
});

// ------------------------------------------------------------------ search
const qEl = document.getElementById("q");
let searchTimer = 0;
qEl.addEventListener("input", () => { clearTimeout(searchTimer); searchTimer = setTimeout(runSearch, 180); });
qEl.addEventListener("keydown", e => {
  if (e.key === "Enter") { clearTimeout(searchTimer); runSearch(true); }
  if (e.key === "Escape") { qEl.value = ""; runSearch(); }
});
function runSearch(jump = false) {
  const q = qEl.value.trim();
  hitsByFile.clear();
  hitVersion++;
  if (!q) { results.innerHTML = `<div class="empty">Search for a function, variable, class or any text.</div>`; updateHitLines(); return; }
  const defs = (defsByName.get(q) || []).slice();
  if (!defs.length) {
    const lq = q.toLowerCase();
    for (const [name, ids] of defsByName) if (name.toLowerCase().startsWith(lq)) defs.push(...ids);
    defs.splice(40);
  }
  const word = /^\w+$/.test(q);
  const re = new RegExp(word ? `\\b${q}\\b` : q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), word ? "" : "i");
  const refs = [];
  let total = 0;
  for (const f of FILES) for (let l = 0; l < f.n; l++) {
    if (re.test(f.lines[l])) {
      total++;
      if (!hitsByFile.has(f.i)) hitsByFile.set(f.i, new Set());
      hitsByFile.get(f.i).add(l + 1);
      if (refs.length < 3000) refs.push([f, l + 1]);
    }
  }
  let h = `<div class="sub" style="margin-bottom:6px"><b style="color:var(--text);font-family:var(--mono)">${esc(q)}</b> &middot; ${defs.length} definitions &middot; ${total.toLocaleString("en-US")} matching lines &middot; ${hitsByFile.size} files</div>`;
  if (defs.length) {
    h += `<h3>Definitions</h3>`;
    for (const i of defs) {
      const n = NODES[i], f = nodeFile(i);
      h += `<div class="filehead">${esc(f.path)}</div><div class="row" data-file="${f.i}" data-line="${n[3]}"><span class="ln">${n[3]}</span><span class="txt">${esc((DET[i] && DET[i].sig) || n[1])}</span><span class="tag">${esc(KINDS[n[0]])}</span></div>`;
    }
  }
  if (refs.length) {
    h += `<h3>Matches</h3>`;
    let last = null;
    for (const [f, l] of refs) {
      if (f !== last) { h += `<div class="filehead">${esc(f.path)}</div>`; last = f; }
      h += `<div class="row" data-file="${f.i}" data-line="${l}"><span class="ln">${l}</span><span class="txt">${esc(f.lines[l - 1].trim())}</span></div>`;
    }
    if (total > refs.length) h += `<div class="more">Showing the first ${refs.length.toLocaleString("en-US")} matches.</div>`;
  }
  if (!defs.length && !refs.length) h += `<div class="empty">No matches.</div>`;
  results.innerHTML = h;
  results.scrollTop = 0;
  showTab("results");
  updateHitLines();
  if (jump) {
    const first = defs.length ? [nodeFile(defs[0]), NODES[defs[0]][3]] : refs[0];
    if (first) select(first[0], first[1], true);
  }
}
results.addEventListener("click", e => {
  const r = e.target.closest("[data-file]");
  if (!r) return;
  results.querySelectorAll(".row.on").forEach(x => x.classList.remove("on"));
  r.classList.add("on");
  const f = FILES[+r.dataset.file], line = +r.dataset.line;
  selected = { f, line, node: symbolAt(f.i, line) };
  updateSelection(); redrawDetails(); renderInspector();
  flyToLine(f, line);
});
function updateHitLines() {
  hitLines.geometry.dispose();
  hitLines.geometry = rectLines([...hitsByFile.keys()].map(fi => [FILES[fi].r, fileTop(FILES[fi]) + 0.03]));
  hitVersion++;
}
function redrawDetails() { hitVersion++; }

// ------------------------------------------------------------------ side panel tabs
function showTab(name) {
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === name));
  inspector.classList.toggle("on", name === "inspector");
  results.classList.toggle("on", name === "results");
  document.getElementById("side").classList.remove("collapsed");
}
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => showTab(b.dataset.tab));
document.getElementById("toggle-side").onclick = () => document.getElementById("side").classList.toggle("collapsed");
if (!matchMedia("(max-width: 820px)").matches) document.getElementById("side").classList.remove("collapsed");

const fmt = x => x.toLocaleString("en-US");
document.getElementById("stats").textContent =
  `${fmt(FILES.length)} files · ${fmt(FILES.reduce((s, f) => s + f.n, 0))} lines · ${fmt(map.meta.counts.function)} functions` +
  (map.meta.commit ? ` · commit ${map.meta.commit}` : "");

// ------------------------------------------------------------------ main loop
const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
let lastPlan = 0;
function frame(now) {
  if (flight) {
    const t = Math.min(1, (now - flight.t0) / flight.dur), k = ease(t);
    camera.position.lerpVectors(flight.fromPos, flight.toPos, k);
    controls.target.lerpVectors(flight.fromT, flight.toT, k);
    if (t >= 1) flight = null;
  }
  if (heightAnim) {
    const t = Math.min(1, (now - heightAnim.t0) / 700);
    HS = heightAnim.from + (heightAnim.to - heightAnim.from) * ease(t);
    applyHeights();
    if (t >= 1) heightAnim = null;
  }
  controls.update();
  const dist = camera.position.distanceTo(controls.target);
  camera.near = Math.max(0.05, dist / 200);
  camera.far = dist * 6 + WORLD * 3;
  camera.updateProjectionMatrix();
  if (now - lastPlan > 200) { planDetails(); lastPlan = now; }
  const t0 = performance.now();
  while (lodQueue.length && performance.now() - t0 < 14) {
    const [fi, size, R] = lodQueue.shift();
    setDetail(fi, size, R);
  }
  updateLabels();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

// deep links: #path/to/File.HC:123 or #SymbolName
function fromHash() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (!h) return false;
  const m = h.match(/^(.+?)(?::(\d+))?$/);
  const f = FILES.find(x => x.path === m[1]);
  if (f) { select(f, +(m[2] || 1), true); return true; }
  const ids = defsByName.get(h);
  if (ids) { select(nodeFile(ids[0]), NODES[ids[0]][3], true); return true; }
  return false;
}
addEventListener("hashchange", fromHash);

setMode("2d");
heightAnim = null; HS = 0.03;
applyHeights();
fitAll(true);
flight = null;
renderInspector();
results.innerHTML = `<div class="empty">Search for a function, variable, class or any text.</div>`;
loading.remove();
requestAnimationFrame(frame);
fromHash();
</script>
</body>
</html>
